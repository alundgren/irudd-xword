<!doctype html>
<html lang="sv">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Morgonkryss</title>
  <style>
    @font-face {
      font-family: Krysskrita;
      src: url("/fonts/Krysskrita.otf") format("opentype");
      font-display: swap;
    }
    @font-face {
      font-family: Rutverk;
      src: url("/fonts/Rutverk.otf") format("opentype");
      font-display: swap;
    }
    * {
      box-sizing: border-box;
    }
    body {
      background: #f6f3ea;
      color: #152e35;
      font: 16px system-ui;
      margin: 24px auto;
      padding: 0 16px;
      max-width: 870px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px double;
      padding: 10px 0;
      gap: 10px;
    }
    .edition-tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
      min-width: 0;
    }
    header select {
      min-width: 0;
      max-width: 100%;
    }
    @media (max-width: 600px) {
      header {
        flex-wrap: wrap;
      }
      .edition-tools {
        justify-content: flex-start;
        width: 100%;
      }
      header select {
        max-width: 100%;
      }
    }
    h1 {
      font: bold clamp(28px, 6vw, 54px) Georgia;
      margin: 0;
    }
    img {
      width: 100%;
      height: clamp(130px, 24vh, 240px);
      object-fit: cover;
      display: block;
      margin: 15px 0;
    }
    #scroll {
      container-type: inline-size;
      overflow: auto;
    }
    #grid {
      display: grid;
      width: max-content;
      margin: auto;
      background: #e6e5d8;
      gap: 1px;
      border: 1px solid #919b91;
    }
    .cell,
    .clue {
      width: 100%;
      min-width: 0;
      border: 0;
      text-align: center;
      padding: 1px;
    }
    .cell {
      height: 100%;
      background: white;
      color: #20363b;
      font: bold 23px Georgia;
      text-transform: uppercase;
      border-radius: 0;
    }
    .cell.active {
      background: #fff3bd;
    }
    .cell.bad {
      box-shadow: inset 0 0 0 2px #a73835;
    }
    .cell:focus {
      outline: 2px solid #317875;
      outline-offset: -2px;
    }
    .box {
      background: #dce7dc;
      display: flex;
      flex-direction: column;
    }
    .clue {
      flex: 1 0 auto;
      padding: 3px 2px;
      font: 600 11px/1.15 system-ui;
      hyphens: auto;
      overflow-wrap: anywhere;
      background: transparent;
      cursor: pointer;
    }
    .clue + .clue {
      border-top: 1px solid #a5b6a8;
    }
    button,
    select,
    textarea {
      font: inherit;
    }
    textarea {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 8px;
    }
    button.action,
    select {
      padding: 7px 12px;
    }
    section {
      margin: 16px 0;
    }
    #hint {
      min-height: 1.4em;
      font-family: Georgia;
    }

    .page.side-by-side {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(0, 2fr);
      gap: 14px;
    }
    .side-by-side img {
      height: 100%;
      max-height: 68vh;
    }
    #scroll {
      padding: 4px;
    }
    .page img {
      border-radius: 3px;
    }
    @media (max-width: 740px) {
      .page.side-by-side {
        display: block;
      }
      .side-by-side img {
        height: 160px;
      }
    }
    .panel {
      position: relative;
      margin: 0;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .page .panel img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      margin: 0;
      border-radius: 0;
    }
    .panel figcaption {
      position: absolute;
      left: 3px;
      bottom: 3px;
      border-radius: 50%;
      color: white;
      background: #173b46;
      padding: 1px 6px;
      font: bold 13px Georgia;
    }
    .illustrated-grid #grid {
      margin-inline: 0;
    }

    body:has([data-print="chalk"]) {
      background: #233735;
      color: #fbf1da;
      --lettering: Krysskrita, sans-serif;
      --key-fill: #304643;
      --key-ink: #fff8df;
      --box-fill: #435957;
      --box-ink: #fff9e8;
      --grid-line: #a7b5a9;
      --selected: #f4dea0;
    }
    body:has([data-print="mechanical"]) {
      background: #f0f3ee;
      color: #19394f;
      --lettering: Rutverk, monospace;
      --key-fill: #fdfdfa;
      --key-ink: #173e54;
      --box-fill: #dae7e9;
      --box-ink: #12374c;
      --grid-line: #819ba5;
      --selected: #f9dbab;
    }
    body:has([data-print="chalk"]) header {
      border-bottom: 2px dashed #b7c8ba;
    }
    body:has([data-print="mechanical"]) header {
      border-block: 1px solid #426275;
    }
    body:has([data-print="chalk"], [data-print="mechanical"]) h1 {
      font-family: var(--lettering);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.025em;
      line-height: 1.1;
    }
    body:has([data-print="chalk"]) h1 {
      color: #eadaaf;
      transform: rotate(-1deg);
      transform-origin: left bottom;
    }
    .page:is([data-print="chalk"], [data-print="mechanical"]) #grid {
      background-color: var(--grid-line);
      border-color: var(--grid-line);
    }
    .page:is([data-print="chalk"], [data-print="mechanical"]) .cell {
      background: var(--key-fill);
      color: var(--key-ink);
      font: 400 25px var(--lettering);
    }
    .page:is([data-print="chalk"], [data-print="mechanical"]) .cell.active {
      background: var(--selected);
      color: #243633;
    }
    .page:is([data-print="chalk"], [data-print="mechanical"]) .box {
      background: var(--box-fill);
    }
    .page:is([data-print="chalk"], [data-print="mechanical"]) .clue {
      color: var(--box-ink);
    }
    .page[data-print="chalk"] .cell.bad {
      box-shadow: inset 0 0 0 3px #f07559;
    }
    .page[data-print="chalk"] .cell:focus {
      outline-color: #5eb9cb;
    }
    .page[data-print="chalk"] .clue + .clue {
      border-top: 1px dashed #a7b5a9;
    }
    .page:is([data-print="chalk"], [data-print="mechanical"]) .panel img {
      object-fit: contain;
    }
    .page[data-print="chalk"] .panel {
      background-color: #172a22;
    }
    .page[data-print="mechanical"] .panel {
      background-color: #f7e5bf;
    }
    .page[data-print="chalk"] .panel figcaption {
      background: #304643;
      border: 1px solid #f4dea0;
      font-family: Krysskrita, sans-serif;
    }
    .page[data-print="mechanical"] .panel figcaption {
      border-radius: 0;
      background: #19394f;
      font-family: Rutverk, monospace;
    }
    .page[data-print="mechanical"] #grid {
      outline: 1px solid #426275;
      outline-offset: 2px;
    }
  </style>
  <main id="app"></main>
  <script type="module" src="/layout.js"></script>
</html>
